# Runs only when something under genair/ changes: server tests, app typecheck + build, and a dependency audit.
name: genair-ci
on:
  push:
    paths: ['genair/**', '.github/workflows/genair-ci.yml']
  pull_request:
    paths: ['genair/**']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genair/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genair/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genair/app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
