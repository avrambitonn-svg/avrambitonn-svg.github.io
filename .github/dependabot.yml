# Weekly update PRs for the Genair app, server and base image. Security updates arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /genair/app
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /genair/server
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /genair/server
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
